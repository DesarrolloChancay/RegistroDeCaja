<!DOCTYPE html>
<html lang="es" class="bg-[#7c4e1a]">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 - Página no encontrada</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindplus/elements@1" type="module"></script>
  </head>
  <body class="bg-[#7c4e1a] font-sans">
    <div class="min-h-screen w-screen flex flex-col items-center justify-center bg-[#7c4e1a] p-0 m-0">
      <div class="flex flex-col items-center justify-center w-full h-full">
        <div class="flex justify-center items-center mb-8">
          <div class="rounded-full bg-white/90 shadow-lg p-6 flex items-center justify-center">
            <img src="/static/img/castillo.svg" alt="No encontrado" class="w-32 h-32 drop-shadow-2xl" />
          </div>
        </div>
        <h1 class="text-6xl font-extrabold text-[#b07c40] mb-2 tracking-tight">404</h1>
        <h2 class="text-2xl font-bold text-white mb-2">Página no encontrada</h2>
        <p class="text-gray-200 mb-8 text-center text-lg max-w-md">
          La página que buscas no existe o fue movida.<br />
        </p>
        <a
          href="/auditoria"
          class="inline-block bg-[#b07c40] hover:bg-[#7c4e1a] text-white font-semibold px-8 py-3 rounded shadow-lg transition text-lg"
        >Volver al inicio</a>
      </div>
    </div>
  </body>
</html>
