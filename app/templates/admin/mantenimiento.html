{% extends "base.html" %}
{% block content %}
<div class="bg-white rounded-xl shadow p-2 sm:p-6">
  <h2 class="text-xl sm:text-2xl font-semibold text-center mb-4 sm:mb-6">Mantenimiento de Caja - {{ titulo }}</h2>

  <div class="mb-4 flex lg:flex-row flex-col gap-2 justify-center items-stretch">
    <button class="tab-btn bg-[#b07c40] text-white px-3 py-2 sm:px-4 sm:py-2 rounded font-semibold shadow w-full xs:w-auto" data-tab="empresas">Empresas</button>
    <button class="tab-btn bg-[#b07c40] text-white px-3 py-2 sm:px-4 sm:py-2 rounded font-semibold shadow w-full xs:w-auto" data-tab="centros_costo">Centros de Costo</button>
    <button class="tab-btn bg-[#b07c40] text-white px-3 py-2 sm:px-4 sm:py-2 rounded font-semibold shadow w-full xs:w-auto" data-tab="usuarios">Usuarios</button>
    <button class="tab-btn bg-[#b07c40] text-white px-3 py-2 sm:px-4 sm:py-2 rounded font-semibold shadow w-full xs:w-auto" data-tab="entidades_banco">Entidades de Pago</button>
    <button class="tab-btn bg-[#b07c40] text-white px-3 py-2 sm:px-4 sm:py-2 rounded font-semibold shadow w-full xs:w-auto" data-tab="medios_pago">Medios de Pago</button>
  </div>

  <div id="tab-content" class="mt-4 sm:mt-6 w-full">
    <!-- Aquí se cargará la tabla y el formulario de la entidad seleccionada vía AJAX -->
  </div>
</div>
<script src="{{ url_for('static', filename='js/admin.js') }}"></script>
{% endblock %}
