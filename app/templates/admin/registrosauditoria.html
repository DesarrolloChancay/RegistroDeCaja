{% extends "base.html" %} {% block content %}
<div class="bg-white rounded-xl shadow p-2 sm:p-6">
  <h2 class="text-xl sm:text-2xl font-semibold text-center mb-4 sm:mb-6">
    Registros de Auditoría - {{ titulo }}
  </h2>

  <!-- Filtros -->
  <div
    class="flex flex-col md:flex-row items-center justify-between gap-2 md:gap-4 mb-4 md:mb-6"
  >
    <!-- Controles de fecha y botones -->
    <div class="flex flex-col sm:flex-row gap-2 items-center w-full md:w-auto">
      <label
        class="flex flex-col sm:flex-row items-start sm:items-center gap-1 sm:gap-2"
      >
        <span class="text-gray-700 text-xs sm:text-sm">Desde</span>
        <input
          type="date"
          id="fecha_desde_admin"
          class="block border border-gray-300 rounded px-2 py-1 sm:px-3 sm:py-2 text-xs sm:text-sm"
        />
      </label>
      <label
        class="flex flex-col sm:flex-row items-start sm:items-center gap-1 sm:gap-2"
      >
        <span class="text-gray-700 text-xs sm:text-sm">Hasta</span>
        <input
          type="date"
          id="fecha_hasta_admin"
          class="block border border-gray-300 rounded px-2 py-1 sm:px-3 sm:py-2 text-xs sm:text-sm"
        />
      </label>
      <button
        id="btn-buscar-rango-admin"
        class="bg-[#b07c40] text-white px-3 py-1 sm:px-4 sm:py-2 rounded font-semibold shadow hover:opacity-90"
      >
        Buscar
      </button>
      <button
        id="btn-borrar-filtros-admin"
        class="bg-gray-400 text-white px-3 py-1 sm:px-4 sm:py-2 rounded font-semibold shadow hover:opacity-90"
        type="button"
      >
        Borrar filtros
      </button>
    </div>

    <!-- Buscador a la derecha -->
    <div class="flex justify-end w-full md:w-auto">
      <div class="flex items-center bg-gray-100 rounded-lg p-1 sm:w-64">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="h-5 w-5 text-gray-500 ml-2"
          viewBox="0 0 20 20"
          fill="currentColor"
        >
          <path
            fill-rule="evenodd"
            d="M12.9 14.32a8 8 0 111.414-1.414l4.387 4.387a1 1 0 01-1.414 1.414l-4.387-4.387zM14 8a6 6 0 11-12 0 6 6 0 0112 0z"
            clip-rule="evenodd"
          />
        </svg>
        <input
          type="text"
          id="buscador-general-admin"
          placeholder="Buscar en la tabla..."
          autocomplete="off"
          class="bg-gray-100 flex-grow px-3 py-2 text-gray-700 focus:outline-none"
        />
      </div>
    </div>
  </div>

  <!-- Selector de cantidad de registros por página -->
  <div class="flex flex-col sm:flex-row items-center justify-end gap-2 mb-2">
    <label
      for="select-registros-pagina-admin"
      class="mr-0 sm:mr-2 text-xs sm:text-sm text-gray-700"
      >Mostrar</label
    >
    <select
      id="select-registros-pagina-admin"
      class="border border-gray-300 rounded px-2 py-1 text-xs sm:text-sm w-full sm:w-auto"
    >
      <option value="10">10</option>
      <option value="25">25</option>
      <option value="50">50</option>
      <option value="100">100</option>
    </select>
    <span class="ml-0 sm:ml-2 text-xs sm:text-sm text-gray-700">registros</span>
  </div>
  <!-- Paginación -->
  <div
    class="flex flex-col gap-2 items-center justify-between bg-white px-4 py-3 sm:px-6 mt-4"
    id="paginacion_auditoria_admin"
  >
    <div
      class="flex flex-col sm:flex-row sm:items-center sm:justify-between w-full gap-2"
    >
      <div>
        <p class="text-sm text-gray-700">
          Mostrando <span class="font-medium" id="pag-desde-admin">1</span> a
          <span class="font-medium" id="pag-hasta-admin">10</span> de
          <span class="font-medium" id="pag-total-admin">0</span> resultados
        </p>
      </div>
      <div>
        <nav
          aria-label="Pagination"
          class="isolate inline-flex -space-x-px rounded-md shadow-xs"
        >
          <button
            id="btn-pag-anterior-admin"
            class="relative inline-flex items-center rounded-l-md px-3 py-2 text-gray-400 border border-gray-300 hover:bg-gray-50 focus:z-20 focus:outline-offset-0"
            type="button"
          >
            <span>&#171;</span>
          </button>
          <span id="paginas-numeros-admin" class="flex"></span>
          <button
            id="btn-pag-siguiente-admin"
            class="relative inline-flex items-center rounded-r-md px-3 py-2 text-gray-400 border border-gray-300 hover:bg-gray-50 focus:z-20 focus:outline-offset-0"
            type="button"
          >
            <span>&#187;</span>
          </button>
        </nav>
      </div>
    </div>
  </div>
  <!-- Tabla -->
  <div class="overflow-x-auto w-full">
    <table class="min-w-full text-xs sm:text-sm text-left border-t">
      <thead
        class="bg-gray-100 text-gray-700 uppercase text-[10px] sm:text-xs md:text-sm"
      >
        <tr>
          <th class="px-2 py-2">Fecha Cambio</th>
          <th class="px-2 py-2">Recibo</th>
          <th class="px-2 py-2">Usuario</th>
          <th class="px-2 py-2">Acción</th>
          <th class="px-2 py-2">Campo</th>
          <th class="px-2 py-2">Valor Anterior</th>
          <th class="px-2 py-2">Valor Nuevo</th>
          <th class="px-2 py-2">Motivo</th>
          <th class="px-2 py-2">IP</th>
        </tr>
      </thead>
      <tbody id="registros_auditoria_admin">
        {% include "admin/_tabla_registrosauditoria.html" %}
      </tbody>
    </table>
  </div>

</div>
<script src="{{ url_for('static', filename='js/admin.js') }}"></script>
{% endblock %}
